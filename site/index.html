<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site name</title>
    <meta
      name="description"
      content="Replace with a short description of your site."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Site name" />
    <meta
      property="og:description"
      content="Replace with a short description of your site."
    />
    <!-- Add canonical URL, og:url, and an absolute og:image URL when the site has a public address. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/utilities.css" />
    <script src="assets/js/main.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="container site-header">
      <nav aria-label="Main">
        <a href="index.html" aria-current="page">Site name</a>
      </nav>
    </header>
    <main id="main" class="container flow" tabindex="-1">
      <h1>Page title</h1>
      <p>Start with your content.</p>
    </main>
    <footer class="container site-footer">
      <p><small>Site name</small></p>
    </footer>
  </body>
</html>
